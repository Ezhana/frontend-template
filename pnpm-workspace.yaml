packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  simple-git-hooks: true
  esbuild: true

catalog:
  '@eslint/js': 10.0.1
  eslint: 10.10.0
  eslint-config-prettier: 10.1.8
  globals: 17.12.0
  prettier: 3.9.8
  prettier-plugin-astro: 1.1.2
  prettier-plugin-svelte: 4.1.1
  typescript: 6.0.2
  typescript-eslint: 8.70.0

minimumReleaseAgeExclude:
  - '@ezhana/eslint-config-base@0.2.0'
  - '@ezhana/prettier-config@0.2.0'
  - create-ezhana-app@3.1.0
